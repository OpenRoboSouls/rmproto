syntax = "proto3";

package robosouls.rmproto.v2026.client;

option go_package = "github.com/openrobosouls/rmproto/v2026/client";
option csharp_namespace = "RoboSouls.JudgeSystem.RoboMaster2026UC.Proto";

/*
机器人 ID 编号如下所示：
- 1：红方英雄机器人
- 2：红方工程机器人
- 3/4/5：红方步兵机器人（与机器人 ID 3~5 对应）
- 6：红方空中机器人
- 7：红方哨兵机器人
- 8：红方飞镖
- 9：红方雷达
- 10：红方前哨站
- 11：红方基地
- 101：蓝方英雄机器人
- 102：蓝方工程机器人
- 103/104/105：蓝方步兵机器人（与机器人 ID 3~5 对应）
- 106：蓝方空中机器人
- 107：蓝方哨兵机器人
- 108：蓝方飞镖
- 109：蓝方雷达
- 110：蓝方前哨站
- 111：蓝方基地
*/
enum RobotId {
  ROBOT_UNKNOWN = 0;
  ROBOT_RED_HERO = 1;
  ROBOT_RED_ENGINEER = 2;
  ROBOT_RED_INFANTRY_1 = 3;
  ROBOT_RED_INFANTRY_2 = 4;
  ROBOT_RED_INFANTRY_3 = 5;
  ROBOT_RED_AIRBORNE = 6;
  ROBOT_RED_SENTINEL = 7;
  ROBOT_RED_DART = 8;
  ROBOT_RED_RADAR = 9;
  ROBOT_RED_OUTPOST = 10;
  ROBOT_RED_BASE = 11;
  ROBOT_BLUE_HERO = 101;
  ROBOT_BLUE_ENGINEER = 102;
  ROBOT_BLUE_INFANTRY_1 = 103;
  ROBOT_BLUE_INFANTRY_2 = 104;
  ROBOT_BLUE_INFANTRY_3 = 105;
  ROBOT_BLUE_AIRBORNE = 106;
  ROBOT_BLUE_SENTINEL = 107;
  ROBOT_BLUE_DART = 108;
  ROBOT_BLUE_RADAR = 109;
  ROBOT_BLUE_OUTPOST = 110;
  ROBOT_BLUE_BASE = 111;
}

/*
选手端 ID 如下所示：
- 0x0101：红方英雄机器人选手端
- 0x0102：红方工程机器人选手端
- 0x0103/0x0104/0x0105：红方步兵机器人选手端
- 0x0106：红方空中机器人选手端
- 0x016A：蓝方空中机器人选手端
- 0x0165：蓝方英雄机器人选手端
- 0x0166：蓝方工程机器人选手端
- 0x0167/0x0168/0x0169：蓝方步兵机器人选手端
- 0x8080：裁判系统服务器（用于哨兵和雷达自主决策指令）
*/
enum ClientId {
  CLIENT_UNKNOWN = 0;
  CLIENT_RED_HERO = 0x0101;
  CLIENT_RED_ENGINEER = 0x0102;
  CLIENT_RED_INFANTRY_1 = 0x0103;
  CLIENT_RED_INFANTRY_2 = 0x0104;
  CLIENT_RED_INFANTRY_3 = 0x0105;
  CLIENT_RED_AIRBORNE = 0x0106;
  CLIENT_BLUE_AIRBORNE = 0x016A;
  CLIENT_BLUE_HERO = 0x0165;
  CLIENT_BLUE_ENGINEER = 0x0166;
  CLIENT_BLUE_INFANTRY_1 = 0x0167;
  CLIENT_BLUE_INFANTRY_2 = 0x0168;
  CLIENT_BLUE_INFANTRY_3 = 0x0169;
  CLIENT_JUDGE_SYSTEM_SERVER = 0x8080;
}

/*
   传输鼠标键盘输入
   自定义客户端→图传链路→机器人
   发送频率：75Hz
*/
message KeyboardMouseControl {
  optional int32 mouse_x = 1; // 鼠标 x 轴移动速度，负值标识向左移动
  optional int32 mouse_y = 2; // 鼠标 y 轴移动速度，负值标识向下移动
  optional int32 mouse_z = 3; // 鼠标滚轮移动速度，负值标识向后滚动
  optional bool left_button_down = 4; // 左键是否按下
  optional bool right_button_down = 5; // 右键是否按下
  optional uint32 keyboard_value = 6; // 键盘按键位掩码
  optional bool mid_button_down = 7; // 中键是否按下
}

/*
   最大30字节的自定义数据
   自定义客户端→图传链路→机器人
   发送频率：75Hz
*/
message CustomControl {
  optional bytes data = 1; // 最大30字节的自定义数据
}

/*
   同步比赛全局状态信息
   服务器→自定义客户端
   发送频率：5Hz
*/
message GameStatus {
  enum Stage {
    STAGE_NOT_STARTED = 0; // 未开始比赛
    STAGE_PREPARATION = 1; // 准备阶段
    STAGE_SELF_CHECK = 2; // 十五秒裁判系统自检阶段
    STAGE_COUNTDOWN = 3; // 五秒倒计时
    STAGE_IN_GAME = 4; // 比赛中
    STAGE_SETTLEMENT = 5; // 比赛结算中
  }
  optional uint32 current_round = 1; // 当前局号（从1开始）
  optional uint32 total_rounds = 2; // 总局数
  optional uint32 red_score = 3; // 红方得分
  optional uint32 blue_score = 4; // 蓝方得分
  optional uint32 current_stage = 5; // 当前比赛阶段
  optional int32 stage_countdown_sec = 6; // 当前阶段剩余时间(秒)
  optional int32 stage_elapsed_sec = 7; // 当前阶段已过时间(秒)
  optional bool is_paused = 8; // 是否暂停
}

/*
   同步基地、前哨站和所有机器人状态
   服务器→自定义客户端
   发送频率：1Hz
*/
message GlobalUnitStatus {
  enum BaseStatus {
    BASE_INVINCIBLE = 0; // 无敌
    BASE_VULNERABLE_ARMOR_RETRACTED = 1; // 解除无敌（护甲未展开）
    BASE_VULNERABLE_ARMOR_DEPLOYED = 2; // 解除无敌（护甲展开）
  }

  enum OutpostStatus {
    OUTPOST_INVINCIBLE = 0; // 无敌
    OUTPOST_ALIVE_ROTATING = 1; // 存活，解除无敌，中部装甲旋转
    OUTPOST_ALIVE_STATIONARY = 2; // 存活，解除无敌，中部装甲停转
    OUTPOST_DESTROYED_NOT_REBUILDABLE = 3; // 被击毁，不可重建
    OUTPOST_DESTROYED_REBUILDABLE = 4; // 被击毁，可重建
    OUTPOST_REBUILDING = 5; // 被击毁，重建中
  }

  optional uint32 base_health = 1; // 己方基地当前血量（0=已摧毁）
  optional uint32 base_status = 2; // 己方基地状态
  optional uint32 base_shield = 3; // 己方基地当前护盾值（0=无护盾）
  optional uint32 outpost_health = 4; // 己方前哨站当前血量（0=已摧毁）
  optional uint32 outpost_status = 5; // 己方前哨站状态

  optional uint32 enemy_base_health = 6; // 对方基地当前血量（0=已摧毁）
  optional uint32 enemy_base_status = 7; // 对方基地状态
  optional uint32 enemy_base_shield = 8; // 对方基地当前护盾值（0=无护盾）
  optional uint32 enemy_outpost_health = 9; // 对方前哨站当前血量（0=已摧毁）
  optional uint32 enemy_outpost_status = 10; // 对方前哨站状态

  repeated uint32 robot_health = 11; // 所有机器人血量（按己方1,2,3,4,7，对方1,2,3,4,7顺序）
  repeated int32 robot_bullets = 12; // 己方机器人剩余累计发弹量
  optional uint32 total_damage_ally = 13; // 己方累计总伤害
  optional uint32 total_damage_enemy = 14; // 对方累计总伤害
}

/*
   同步全局后勤信息
   服务器→自定义客户端
   发送频率：1Hz
*/
message GlobalLogisticsStatus {
  optional uint32 remaining_economy = 1; // 己方当前经济
  optional uint64 total_economy_obtained = 2; // 己方累计总经济
  optional uint32 tech_level = 3; // 己方科技等级（工程曾装配最高难度）
  optional uint32 encryption_level = 4; // 己方加密等级（雷达解析机制）
}

/*
   同步正在生效的全局特殊机制
   服务器→自定义客户端
   发送频率：1Hz
*/
message GlobalSpecialMechanism {
  enum MechanismID {
    MECH_UNKNOWN = 0; // 占位
    MECH_OWN_FORTRESS_OCCUPIED = 1; // 己方堡垒被对方占领计时
    MECH_ENEMY_FORTRESS_OCCUPIED = 2; // 对方堡垒被己方占领计时
  }
  repeated uint32 mechanism_id = 1; // 正在生效的机制 ID 列表
  repeated int32 mechanism_time_sec = 2; // 对应的时间参数
}

/*
   全局事件通知
   服务器→自定义客户端
   发送频率：触发式发送
*/
message Event {
  enum EventID {
    EVENT_ID_UNKNOWN = 0; // 占位
    EVENT_ID_KILL = 1; // 击杀事件（参数1为被击杀者，参数2为击杀者）
    EVENT_ID_OUTPOST_DESTROYED = 2; // 前哨站被摧毁事件（参数为被击毁目标id）
    EVENT_ID_RUNE_ACTIVATION_STATS = 3; // 当前大能量机关被成功激活的灯臂数量、平均环数
    EVENT_ID_RUNE_ACTIVATED = 4; // 能量机关进入已激活状态（参数：1为小，2为大）
    EVENT_ID_OWN_HERO_SNIPE_DAMAGE = 5; // 己方英雄造成狙击伤害
    EVENT_ID_ENEMY_HERO_SNIPE_DAMAGE = 6; // 对方英雄造成狙击伤害
    EVENT_ID_ENEMY_AIR_SUPPORT_CALL = 7; // 对方呼叫空中支援
    EVENT_ID_ENEMY_AIR_SUPPORT_INTERRUPTED = 8; // 对方空中支援被反制
    EVENT_ID_DART_HIT = 9; // 飞镖命中（参数1命中方，参数2命中目标）
    EVENT_ID_ENEMY_DART_GATE_OPEN = 10; // 对方飞镖闸门开启
    EVENT_ID_BASE_UNDER_ATTACK = 11; // 基地遭到攻击
    EVENT_ID_ENEMY_OUTPOST_STOP_ROTATING = 12; // 对方前哨站停转
    EVENT_ID_ENEMY_BASE_ARMOR_EXPANDED = 13; // 对方基地护甲展开
    EVENT_ID_ASSEMBLY_LEVEL4_INTERRUPT = 14; // 装配过程中对方请求四级装配，进入强制退出缓冲期
    EVENT_ID_ASSEMBLY_RESULT = 15; // 装配结果事件(0 成功，1 拔出，2 超时等)
  }
  optional int32 event_id = 1; // 事件编号
  optional string param = 2; // 事件参数（含义随 event_id 变化）
}

/*
   机器人一次存活期间累计受伤统计
   服务器→自定义客户端
   发送频率：1Hz
*/
message RobotInjuryStat {
  optional uint32 total_damage = 1; // 该次存活累计受伤总计
  optional uint32 collision_damage = 2; // 撞击伤害
  optional uint32 small_projectile_damage = 3; // 17mm 弹丸伤害
  optional uint32 large_projectile_damage = 4; // 42mm 弹丸伤害
  optional uint32 dart_splash_damage = 5; // 飞镖溅射伤害
  optional uint32 module_offline_damage = 6; // 模块离线扣血
  optional uint32 offline_damage = 7; // 异常离线扣血
  optional uint32 penalty_damage = 8; // 判罚扣血
  optional uint32 server_kill_damage = 9; // 服务器强制使其战亡扣血
  optional uint32 killer_id = 10; // 击杀者 ID
}

/*
   机器人复活状态同步
   服务器→自定义客户端
   发送频率：1Hz
*/
message RobotRespawnStatus {
  optional bool is_pending_respawn = 1; // 是否处于待复活状态
  optional uint32 total_respawn_progress = 2; // 复活所需总读条
  optional uint32 current_respawn_progress = 3; // 当前复活读条进度
  optional bool can_free_respawn = 4; // 是否可以免费复活
  optional uint32 gold_cost_for_respawn = 5; // 花费金币复活所需金币数
  optional bool can_pay_for_respawn = 6; // 是否允许花费金币复活
}

/*
   机器人固定属性和配置
   服务器→自定义客户端
   发送频率：1Hz
*/
message RobotStaticStatus {
  enum PerformanceSystemShooter {
    SHOOTER_UNKNOWN = 0;
    SHOOTER_COOLING_PRIORITY = 1; // 冷却优先
    SHOOTER_BURST_PRIORITY = 2; // 爆发优先
    SHOOTER_HERO_MELEE = 3; // 英雄近战优先
    SHOOTER_HERO_RANGED = 4; // 英雄远程优先
  }

  enum PerformanceSystemChassis {
    CHASSIS_UNKNOWN = 0;
    CHASSIS_HEALTH_PRIORITY = 1; // 血量优先
    CHASSIS_POWER_PRIORITY = 2; // 功率优先
    CHASSIS_HERO_MELEE = 3; // 英雄近战优先
    CHASSIS_HERO_RANGED = 4; // 英雄远程优先
  }

  optional uint32 connection_state = 1; // 连接状态（0=未连接, 1=已连接）
  optional uint32 field_state = 2; // 上场状态（0=已上场, 1=未上场）
  optional uint32 alive_state = 3; // 存活状态（0=未知, 1=存活, 2=战亡）
  optional uint32 robot_id = 4; // 机器人编号
  optional uint32 robot_type = 5; // 机器人类型
  optional uint32 performance_system_shooter = 6; // 性能体系-发射机构
  optional uint32 performance_system_chassis = 7; // 性能体系-底盘
  optional uint32 level = 8; // 当前等级
  optional uint32 max_health = 9; // 最大血量
  optional uint32 max_heat = 10; // 最大热量
  optional float heat_cooldown_rate = 11; // 热量冷却速率（每秒）
  optional uint32 max_power = 12; // 最大功率
  optional uint32 max_buffer_energy = 13; // 最大缓冲能量
  optional uint32 max_chassis_energy = 14; // 最大底盘能量
}

/*
   机器人实时数据
   服务器→自定义客户端
   发送频率：10Hz
*/
message RobotDynamicStatus {
  optional uint32 current_health = 1; // 当前血量
  optional float current_heat = 2; // 当前热量
  optional float last_projectile_fire_rate = 3; // 上一次弹丸射速
  optional uint32 current_chassis_energy = 4; // 当前剩余底盘能量
  optional uint32 current_buffer_energy = 5; // 当前缓冲能量
  optional uint32 current_experience = 6; // 当前经验值
  optional uint32 experience_for_upgrade = 7; // 距离下一次升级仍需获得的经验
  optional uint32 total_projectiles_fired = 8; // 累计已发弹量
  optional uint32 remaining_ammo = 9; // 剩余允许发弹量
  optional bool is_out_of_combat = 10; // 是否处于脱战状态
  optional uint32 out_of_combat_countdown = 11; // 脱战状态倒计时
  optional bool can_remote_heal = 12; // 是否可以远程补血
  optional bool can_remote_ammo = 13; // 是否可以远程补弹
}

/*
   机器人各模块运行状态
   服务器→自定义客户端
   发送频率：1Hz
*/
message RobotModuleStatus {
  // 模块状态通用定义：0=离线，1=在线，2=因安装不规范被视为离线
  optional uint32 power_manager = 1; // 电源管理模块状态
  optional uint32 rfid = 2; // RFID 模块状态
  optional uint32 light_strip = 3; // 灯条模块状态
  optional uint32 small_shooter = 4; // 17mm 发射机构状态
  optional uint32 big_shooter = 5; // 42mm 发射机构状态
  optional uint32 uwb = 6; // 定位模块状态
  optional uint32 armor = 7; // 装甲模块状态
  optional uint32 video_transmission = 8; // 图传模块状态
  optional uint32 capacitor = 9; // 电容模块状态
  optional uint32 main_controller = 10; // 主控状态
  optional uint32 laser_detection_module = 11; // 激光检测模块状态
}

/*
   机器人空间坐标和朝向
   服务器→自定义客户端
   发送频率：1Hz
*/
message RobotPosition {
  optional float x = 1; // 世界坐标 X 轴
  optional float y = 2; // 世界坐标 Y 轴
  optional float z = 3; // 世界坐标 Z 轴
  optional float yaw = 4; // 本机器人测速模块的朝向，单位：度，正北为 0 度
  optional uint32 robot_id = 5; // 接受到的坐标归属机器人（6/106 为空中，7/107 为哨兵）
}

/*
   Buff效果信息
   服务器→自定义客户端
   发送频率：获得增益时触发，此后1Hz直到失去增益
*/
message Buff {
  enum BuffType {
    BUFF_UNKNOWN = 0; // 占位
    BUFF_ATTACK = 1; // 攻击增益
    BUFF_DEFENSE = 2; // 防御增益/负防御增益（易伤）
    BUFF_COOLDOWN = 3; // 射击热量冷却增益
    BUFF_POWER = 4; // 底盘功率增益
    BUFF_HEALING = 5; // 回血增益
    BUFF_AMMO = 6; // 可兑换允许发弹量
    BUFF_TERRAIN_BOOST = 7; // 地形跨越增益（预备）
  }

  optional uint32 robot_id = 1; // 机器人 ID
  optional uint32 buff_type = 2; // Buff 类型
  optional int32 buff_level = 3; // Buff 增益值 (百分比或直接值)
  optional uint32 buff_max_time = 4; // Buff 最大剩余时间
  optional uint32 buff_left_time = 5; // Buff 剩余时间
}

/*
   判罚信息同步
   服务器→自定义客户端
   发送频率：触发式发送
*/
message PenaltyInfo {
  enum PenaltyType {
    PENALTY_UNKNOWN = 0; // 占位
    YELLOW_CARD = 1; // 黄牌
    BOTH_YELLOW_CARD = 2; // 双方黄牌
    RED_CARD = 3; // 红牌
    OVER_POWER = 4; // 超功率
    OVER_HEAT = 5; // 超热量
    OVER_FIRE_RATE = 6; // 超射速
  }
  optional uint32 penalty_type = 1; // 当前受罚类型
  optional uint32 penalty_effect_sec = 2; // 当前受罚效果时长（秒）
  optional uint32 total_penalty_num = 3; // 当前判罚数量
}

/*
   哨兵轨迹规划信息
   服务器→自定义客户端
   发送频率：触发式发送
*/
message RobotPathPlanInfo {
  enum Intention {
    INTENTION_UNKNOWN = 0; // 占位
    INTENTION_ATTACK = 1; // 攻击
    INTENTION_DEFEND = 2; // 防守
    INTENTION_MOVE = 3; // 移动
  }
  optional uint32 intention = 1; // 哨兵意图
  optional uint32 start_pos_x = 2; // 起始点 X 坐标（分米）
  optional uint32 start_pos_y = 3; // 起始点 Y 坐标（分米）
  repeated int32 offset_x = 4 [packed = true]; // 相对起始点 X 增量数组（-128~+127, 长度 49）
  repeated int32 offset_y = 5 [packed = true]; // 相对起始点 Y 增量数组（-128~+127, 长度 49）
  optional uint32 sender_id = 6; // 发送者 ID
}

/*
   云台手地图点击标记
   自定义客户端→服务器 ; 服务器→自定义客户端
   发送频率：触发式发送
*/
message MapClickInfoNotify {
  enum SendRange {
    SPECIFIC_CLIENT = 0; // 指定客户端
    TEAM_EXCEPT_SENTINEL = 1; // 除哨兵外所有己方机器人
    TEAM_ALL = 2; // 包含哨兵的所有己方机器人
  }
  enum MarkMode {
    MODE_UNKNOWN = 0; // 占位
    MODE_ATTACK = 1; // 攻击
    MODE_DEFENSE = 2; // 防御
    MODE_ALERT = 3; // 警戒
    MODE_CUSTOM = 4; // 自定义
  }
  enum MarkType {
    TYPE_UNKNOWN_MARK = 0; // 占位
    MAP_COORDINATE = 1; // 地图坐标标记
    TARGET_ROBOT = 2; // 对方机器人标记
  }
  optional uint32 is_send_all = 1; // 发送范围
  optional bytes robot_id = 2; // 目标机器人 ID 列表
  optional uint32 mode = 3; // 标记类型
  optional uint32 enemy_id = 4; // 标定的对方 ID
  optional uint32 ascii = 5; // 自定义图标 ASCII 码
  optional uint32 type = 6; // 标记模式
  optional float map_x = 7; // 地图坐标 X
  optional float map_y = 8; // 地图坐标 Y
}

/*
   雷达发送的机器人位置信息
   服务器→自定义客户端
   发送频率：触发式发送
*/
message RadarInfoToClient {
  repeated RadarSingleRobotInfo RadarSingleRobotInfo = 1; // 包含所有机器人位置信息的数组
}

message RadarSingleRobotInfo {
  optional uint32 target_pos_x = 1; // 机器人位置 x（cm）
  optional uint32 target_pos_y = 2; // 机器人位置 y（cm）
  optional uint32 is_high_light = 3; // 机器人是否特殊标识（0=否；1=是；2=是，但目标机器人定位离线）
}

/*
   机器人自定义上传数据流
   机器人→图传链路→自定义客户端
   发送频率：50Hz
*/
message CustomByteBlock {
  optional bytes data = 1; // 最大为 2.4 kbit 的自定义数据包
}

/*
   工程装配指令
   自定义客户端→服务器
   发送频率：触发式发送，最高 10Hz
*/
message AssemblyCommand {
  enum Operation {
    START_EXCHANGE = 0; // 开始兑换
    CONFIRM = 1; // 确认装配
    CANCEL = 2; // 取消装配
  }
  optional uint32 operation = 1; // 装配操作类型
  optional uint32 difficulty = 2; // 选中的装配难度
}

/*
   科技核心运动状态同步
   服务器→自定义客户端
   发送频率：1Hz
*/
message TechCoreMotionStateSync {
  optional uint32 maximum_difficulty_level = 1; // 当前可选择的最高装配难度等级
  optional uint32 basic_state = 2; // 科技核心基础状态，1 为初始位置，2 为运动中，3 为已到达对应位姿
  optional uint32 putin_state = 3; // 能量单元放入状态，0 为未放入，1 为已经放入
  optional uint32 move_state = 4; // 能量单元平移状态，0 为未平移，1 为已经平移
  optional uint32 rotate_state = 5; // 能量单元旋转状态，0 为未旋转，1 为已经旋转
  optional uint32 enemy_core_status = 6; // 对方科技核心状态（0=未装配，1=非四级难度，2=四级难度）
  optional uint32 remain_time_all = 7; // 己方装配总剩余时长（仅己方正在四级装配时有效）
  optional uint32 remain_time_step = 8; // 己方单个步骤装配间隔剩余时长（仅己方正在四级装配时有效）
}

/*
   地面机器人选择性能体系或控制方式
   自定义客户端→服务器
   发送频率：触发式发送，最高 10Hz
*/
message RobotPerformanceSelectionCommand {
  optional uint32 shooter = 1; // 发射机构性能体系枚举值
  optional uint32 chassis = 2; // 底盘性能体系枚举值
  optional uint32 sentry_control = 3; // 哨兵控制方式选择 (0=自动控制, 1=半自动控制)
}

/*
   步兵/英雄性能体系状态同步
   服务器→自定义客户端
   发送频率：1Hz
*/
message RobotPerformanceSelectionSync {
  optional uint32 shooter = 1; // 发射机构性能体系
  optional uint32 chassis = 2; // 底盘性能体系
  optional uint32 sentry_control = 3; // 哨兵控制方式选择
}

/*
   机器人多种常用指令
   自定义客户端→服务器
   发送频率：触发式发送，最高 10Hz
*/
message CommonCommand {
  enum CmdType {
    CMD_UNKNOWN = 0; // 占位
    EXCHANGE_17MM = 1; // 兑换 17mm 发弹量
    EXCHANGE_42MM = 2; // 兑换 42mm 发弹量
    CONFIRM_RESPAWN = 3; // 确认复活
    EXCHANGE_IMMEDIATE_RESPAWN = 4; // 兑换立即复活
    REMOTE_EXCHANGE_AMMO = 5; // 远程兑换允许发弹量
    REMOTE_EXCHANGE_HEALTH = 6; // 远程兑换血量
  }
  optional uint32 cmd_type = 1; // 命令类型
  optional uint32 param = 2; // 命令类型对应的参数
}

/*
   英雄部署模式相关指令
   自定义客户端→服务器
   发送频率：触发式发送，最高 10Hz
*/
message HeroDeployModeEventCommand {
  enum DeployModeCmd {
    EXIT = 0; // 退出部署模式
    ENTER = 1; // 进入部署模式
  }
  optional uint32 mode = 1; // 模式
}

/*
   英雄部署模式状态同步
   服务器→自定义客户端
   发送频率：1Hz
*/
message DeployModeStatusSync {
  enum DeployStatus {
    NOT_DEPLOYED = 0; // 未部署
    DEPLOYED = 1; // 已部署
  }
  optional uint32 status = 1; // 当前部署模式状态
}

/*
   能量机关激活指令
   自定义客户端→服务器
   发送频率：触发式发送，最高 10Hz
*/
message RuneActivateCommand {
  optional uint32 activate = 1; // 激活指令（1=开启）
}

/*
   能量机关状态同步
   服务器→自定义客户端
   发送频率：1Hz
*/
message RuneStatusSync {
  enum RuneStatus {
    RUNE_UNKNOWN = 0; // 占位
    INACTIVE = 1; // 未激活
    ACTIVATING = 2; // 正在激活
    ACTIVATED = 3; // 已激活
  }
  optional uint32 rune_status = 1; // 当前能量机关状态枚举
  optional uint32 activated_arms = 2; // 当前已激活的灯臂数量
  optional float average_rings = 3; // 平均环数（仅大能量机关正在激活状态有效）
}

/*
   哨兵姿态相关信息同步
   服务器→自定义客户端
   发送频率：1Hz
*/
message SentryStatusSync {
  enum Posture {
    POSTURE_UNKNOWN = 0; // 占位
    POSTURE_ATTACK = 1; // 进攻姿态
    POSTURE_DEFENSE = 2; // 防御姿态
    POSTURE_MOVE = 3; // 移动姿态
  }
  optional uint32 posture_id = 1; // 姿态 ID
  optional bool is_weakened = 2; // 是否弱化
}

/*
   飞镖控制指令
   自定义客户端→服务器
   发送频率：触发式发送，最高 10Hz
*/
message DartCommand {
  enum DartTarget {
    TARGET_UNKNOWN = 0; // 占位
    OUTPOST = 1; // 前哨站
    BASE_FIXED = 2; // 基地固定目标
    BASE_RANDOM_FIXED = 3; // 基地随机固定目标
    BASE_RANDOM_MOVE = 4; // 基地随机移动目标
    BASE_END_MOVE = 5; // 基地末端移动目标
  }
  optional uint32 target_id = 1; // 目标 ID
  optional bool open = 2; // 闸门开关
  optional bool launch_confirm = 3; // 是否确认发射（默认为 0，1 为确认发射）
}

/*
   飞镖目标选择状态同步
   服务器→自定义客户端
   发送频率：1Hz
*/
message DartSelectTargetStatusSync {
  optional uint32 target_id = 1; // 目标 ID
  optional uint32 open = 2; // 闸门状态（0：关闭，1：开启中，2：已开启）
}

/*
   哨兵控制指令请求
   自定义客户端→服务器
   发送频率：触发式发送，最高 10Hz
*/
message SentryCtrlCommand {
  enum GuardCommandID {
    CMD_INVALID = 0; // 无效
    HEAL_POINT_AMMO = 1; // 补血点补弹
    SUPPLY_STATION_AMMO = 2; // 补给站实体补弹
    REMOTE_AMMO = 3; // 远程补弹
    REMOTE_HEAL = 4; // 远程回血
    FREE_RESPAWN = 5; // 确认复活
    GOLD_RESPAWN = 6; // 确认花费金币复活
    SWITCH_ATTACK = 7; // 切换为进攻姿态
    SWITCH_DEFENSE = 8; // 切换为防御姿态
    SWITCH_MOVE = 9; // 切换为移动姿态
  }
  optional uint32 command_id = 1; // 指令编号
}

/*
   哨兵控制指令结果反馈
   服务器→自定义客户端
   发送频率：触发式发送
*/
message SentryCtrlResult {
  optional uint32 command_id = 1; // 对应的指令编号
  optional uint32 result_code = 2; // 执行结果码 (0：成功，其他：失败)
}

/*
   空中支援指令
   自定义客户端→服务器
   发送频率：触发式发送
*/
message AirSupportCommand {
  enum AirSupportCmdID {
    CANCEL_SUPPORT = 0; // 取消空中支援
    FREE_CALL = 1; // 免费呼叫空中支援
    GOLD_CALL = 2; // 花费金币呼叫空中支援
  }
  optional uint32 command_id = 1; // 指令类型
}

/*
   空中支援状态反馈
   服务器→自定义客户端
   发送频率：1Hz
*/
message AirSupportStatusSync {
  enum AirSupportStatus {
    STATUS_IDLE = 0; // 未进行空中支援
    STATUS_ACTIVE = 1; // 正在空中支援
  }
  enum ShooterStatus {
    SHOOTER_LOCKED = 0; // 发射机构因雷达反制而被锁定
    SHOOTER_NORMAL = 1; // 发射机构正常，未被反制
  }
  optional uint32 airsupport_status = 1; // 空中支援状态
  optional uint32 left_time = 2; // 免费空中支援剩余时间
  optional uint32 cost_coins = 3; // 付费空中支援已花费金币
  optional uint32 is_being_targeted = 4; // 当前激光检测模块是否正在检测到被照射
  optional uint32 shooter_status = 5; // 空中机器人被反制状态
}