    DEPLOYED = 1; // 已部署
  }
  uint32 status = 1; // 当前部署模式状态
}

/*
   能量机关激活指令
   自定义客户端→服务器
   发送频率：1Hz
*/
message RuneActivateCommand {
  uint32 activate = 1; // 激活指令（1=开启，0=取消）
}

/*
   能量机关状态同步
