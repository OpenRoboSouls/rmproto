message CommonCommand {
  enum CmdType {
    CMD_UNKNOWN = 0; // 占位
    EXCHANGE_17MM = 1; // 兑换 17mm 发弹量
    EXCHANGE_42MM = 2; // 兑换 42mm 发弹量
    CONFIRM_RESPAWN = 3; // 确认复活
