}

/*
   哨兵控制指令请求
   自定义客户端→服务器
   发送频率：1Hz
*/
message SentryCtrlCommand {
  enum GuardCommandID {
    CMD_INVALID = 0; // 无效指令
    HEAL_POINT_AMMO = 1; // 补血点补弹
    SUPPLY_STATION_AMMO = 2; // 补给站实体补弹
    REMOTE_AMMO = 3; // 远程补弹
    REMOTE_HEAL = 4; // 远程回血
    FREE_RESPAWN = 5; // 确认复活
    GOLD_RESPAWN = 6; // 确认花费金币复活
    MAP_MARK = 7; // 地图标点
    SWITCH_ATTACK = 8; // 切换为进攻姿态
    SWITCH_DEFENSE = 9; // 切换为防御姿态
    SWITCH_MOVE = 10; // 切换为移动姿态
  }
  uint32 command_id = 1; // 指令编号
}

/*
   哨兵控制指令结果反馈
   服务器→自定义客户端
   发送频率：1Hz
*/
message SentryCtrlResult {
  uint32 command_id = 1; // 对应的指令编号
  uint32 result_code = 2; // 执行结果码 (0=成功，其他=失败)
}

/*
   空中支援指令
   自定义客户端→服务器
   发送频率：1Hz
*/
message AirSupportCommand {
  enum AirSupportCmdID {
    CMD_UNKNOWN = 0; // 占位
    FREE_CALL = 1; // 免费呼叫空中支援
    GOLD_CALL = 2; // 花费金币呼叫空中支援
    INTERRUPT = 3; // 中断空中支援
  }
  uint32 command_id = 1; // 指令类型
}

/*
   空中支援状态反馈
   服务器→自定义客户端
   发送频率：1Hz
*/
message AirSupportStatusSync {
  enum AirSupportStatus {
    STATUS_IDLE = 0; // 未进行空中支援
    STATUS_ACTIVE = 1; // 正在空中支援
  }
  enum ShooterStatus {
    SHOOTER_LOCKED = 0; // 发射机构因雷达反制而被锁定
    SHOOTER_NORMAL = 1; // 发射机构正常，未被反制
  }
  uint32 airsupport_status = 1; // 空中支援状态
  uint32 left_time = 2; // 免费空中支援剩余时间
  uint32 cost_coins = 3; // 付费空中支援已花费金币
  uint32 is_being_targeted = 4; // 当前激光检测模块是否正在检测到被照射（0 为未被照射，1 为被照射）
  uint32 shooter_status = 5; // 空中机器人被反制状态
}