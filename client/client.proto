    REMOTE_EXCHANGE_AMMO = 5; // 远程兑换允许发弹量
    REMOTE_EXCHANGE_HEALTH = 6; // 远程兑换血量
  }
  uint32 cmd_type = 1; // 命令类型
  uint32 param = 2; // 命令类型对应的参数
}

/*
